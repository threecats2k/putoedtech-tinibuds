<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Delete Me</title>
  <meta name="description" content="Just a smoke test" />
  <meta name="theme-color" content="#0B0B0F" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0B0B0F;
      --bg-elevated: #16161D;
      --text: #F2F2F5;
      --text-muted: #9A9AA7;
      --accent: #34D399;
      --accent-2: #059669;
      --border: rgba(242, 242, 245, 0.08);
      --radius-pill: 999px;
      --font-display: "Outfit", "Segoe UI", sans-serif;
      --font-body: "Manrope", "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.5;
    }
    .nav {
      max-width: 960px;
      margin-inline: auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
    }
    .nav__badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 800;
    }
    main {
      max-width: 960px;
      margin-inline: auto;
      padding: 48px 24px 96px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.02em;
      max-width: 18ch;
      margin: 0 0 20px;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 50ch;
      margin: 0 0 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-family: var(--font-display);
      font-weight: 600;
      text-decoration: none;
    }
    footer {
      max-width: 960px;
      margin-inline: auto;
      padding: 48px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="nav">
    <span class="nav__badge" aria-hidden="true">T</span>
    Test Delete Me
  </header>

  <main>
    <h1>Test Delete Me</h1>
    <p class="sub">Just a smoke test</p>
    <a class="btn" href="#">Coming soon to the App Store</a>
  </main>

  <footer>Test Delete Me &middot; &copy; <span id="year"></span></footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
